openapi: 3.0.3
info:
  title: ImmoTopia — Contrôle du stock de chantier (spec 040, sprints A et B)
  version: 2.0.0 # révision 2, après critique adverse (04/10/2026)
  description: >
    Routes nouvelles (x-statut: nouvelle) et modifiées (x-statut: modifiée) du lot
    040. Chaque opération indique sa permission (x-permission), sa fonctionnalité
    d'abonnement (x-fonctionnalite : CONSTRUCTION partout, par préfixe,
    packages/api/src/lib/subscription/route-features.ts:157-162 — aucun changement
    de gating, décision D1), son événement d'audit (x-audit), ce qui est masqué
    sans STOCK_VALUES_VIEW (x-masquage-valeurs) et ce qui est masqué pendant un
    comptage à l'aveugle (x-masquage-aveugle).

    Règles communes :
    - Toutes les routes passent authenticate + requireTenantAccess ; tenantId
      vient de l'URL. Tout identifiant reçu (lieu, article, chantier, poste,
      facture, ligne de facture, preneur, employé, tâcheron, inventaire, bon,
      pièce jointe, alerte) est vérifié comme appartenant à l'agence : une
      référence d'une autre agence répond 404, comme un objet inexistant.
    - Enveloppe de succès : { success: true, data, meta? }. Enveloppe d'erreur :
      { success: false, message, error, code?, errors?, data? }
      (packages/api/src/middleware/error-middleware.ts:18-42).
    - Masquage des valeurs (spec.md §8.1) : sans STOCK_VALUES_VIEW, chaque champ
      marqué « valeur » vaut null ; meta.valuesVisible = false.
    - Aveugle (spec.md §8.2, révision 2) : un lieu portant un inventaire DRAFT
      est « en comptage ». Pour un appelant sans STOCK_COUNT_VALIDATE (même
      détenteur de STOCK_VALUES_VIEW), sur ce lieu, valent null : quantity,
      value, averageUnitCost (soldes) ; quantityAfter, valueAfter, unitCost
      (mouvements du lieu, partout où ils sont rendus : journal, CSV, bons,
      réponses d'écriture, réceptions d'une facture) ; remainingQuantity,
      remainingValue (rapprochement du chantier). onlyInStock ne filtre pas un
      lieu en comptage. meta.blindLocationIds liste ces lieux. Les routes
      d'inventaire masquent attendu et écart à TOUS tant que l'inventaire est
      DRAFT.
    - Idempotence (spec.md B3-R2) : rejeu même utilisateur, même corps → 200,
      résultat d'origine RE-MASQUÉ pour l'appelant ; corps différent ou autre
      utilisateur → 409 STOCK_IDEMPOTENCY_MISMATCH.
    - Dates de mouvement : AAAA-MM-JJ ; pas dans le futur (UTC), pas plus
      anciennes que backdatingLimitDays (A5-R4).
    - Vocabulaire (D2) : aucun message, libellé ni champ ne contient « vol »,
      « voleur », « fraude » ou « détournement ».
servers:
  - url: /api
tags:
  - name: Terrain
  - name: Mouvements
  - name: Bons
  - name: Inventaires
  - name: Preneurs
  - name: PiecesJointes
  - name: Alertes
  - name: Indicateurs
  - name: Reglages
  - name: Referentiel
  - name: Chantiers

paths:
  # ===========================================================================
  # Terrain (B3)
  # ===========================================================================
  /tenants/{tenantId}/finance/stock/field-context:
    get:
      tags: [Terrain]
      summary: Tout ce dont l'écran mobile a besoin, en un appel
      x-statut: nouvelle
      x-permission: STOCK_VIEW
      x-fonctionnalite: CONSTRUCTION
      x-masquage-valeurs: receivableInvoices[].amount ; takers[].phone sans STOCK_TAKERS_MANAGE ; people vide sans STOCK_TAKERS_MANAGE
      x-masquage-aveugle: aucune quantité n'est renvoyée par cette route ; locations[].countInProgress signale le lieu en comptage
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Contexte terrain
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/FieldContext" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ===========================================================================
  # Mouvements (A5, A6, A8, A10, A11, B2)
  # ===========================================================================
  /tenants/{tenantId}/finance/stock/receipts:
    post:
      tags: [Mouvements]
      summary: Enregistrer une réception (un bon BR, un mouvement par ligne)
      description: >
        Facture VALIDÉE exigée (inchangé). Lieu actif ; refusé sur le lieu d'un
        chantier clos (A7-R4). Prix de chaque ligne selon A8-R3. Contrôles A8-R2
        renvoyés dans controls et ouverts en alertes. Verrous A10.
      x-statut: modifiée
      x-permission: STOCK_RECEIVE (était FINANCE_DOCUMENTS_CREATE)
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_RECEIPT_RECORDED (critique)
      x-masquage-valeurs: movements[].unitCost, totalValue, valueAfter, valuationSource ; controls[].amount, threshold (message alors sans montant)
      x-masquage-aveugle: movements[].quantityAfter, valueAfter, unitCost si le lieu est en comptage
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptRequest" }
      responses:
        "200":
          description: Rejeu idempotent (même clientRequestId, même corps) — résultat d'origine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptResultEnvelope" }
        "201":
          description: Réception enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptResultEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/receivable-invoices:
    get:
      tags: [Mouvements]
      summary: Chercher une facture validée réceptionnable (au-delà des 50 du contexte terrain)
      description: >
        Factures VALIDÉES de l'agence, plus récentes d'abord, sans leurs lignes
        (elles se lisent par /stock/supplier-invoices/{invoiceId}/receipts).
        Recherche sur la référence et le nom du fournisseur. Résout la question
        Q9 des écrans : le magasinier peut réceptionner une facture ancienne.
      x-statut: nouvelle
      x-permission: STOCK_VIEW
      x-fonctionnalite: CONSTRUCTION
      x-masquage-valeurs: data[].amount
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        "200":
          description: Une page de factures
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReceivableInvoice" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenants/{tenantId}/finance/stock/supplier-invoices/{invoiceId}/receipts:
    get:
      tags: [Mouvements]
      summary: Réceptions et retours déjà enregistrés sur une facture, lignes de la facture et cumul par article
      x-statut: nouvelle
      x-permission: STOCK_VIEW
      x-fonctionnalite: CONSTRUCTION
      x-masquage-valeurs: invoice.amount, invoice.lines[].unitPrice, amount ; receipts[].lines[].unitCost, totalValue ; byItem[].valuationSources ; receivedValue ; returnedValue
      x-masquage-aveugle: returns[].quantityAfter, valueAfter, unitCost pour un lieu en comptage
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Historique de la facture
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/InvoiceReceiptsView" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenants/{tenantId}/finance/stock/issues:
    post:
      tags: [Mouvements]
      summary: Sortir vers un chantier (un bon BS, 1 à 50 lignes)
      description: >
        Corps multi-lignes, ou corps à un article (forme actuelle) converti en une
        ligne. Preneur ou demandeur obligatoire (B2-R3). Chaque ligne écrit son
        mouvement, son écriture (poste ou 605 / 311) et son imputation STOCK_ISSUE
        (inchangé). Chantier ouvert exigé (inchangé). Alerte LARGE_ISSUE si la
        valeur du bon atteint le seuil. Verrous A10.
      x-statut: modifiée
      x-permission: STOCK_ISSUE (était FINANCE_DOCUMENTS_CREATE)
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_ISSUE_RECORDED (critique)
      x-masquage-valeurs: movements[].unitCost, totalValue, valueAfter
      x-masquage-aveugle: movements[].quantityAfter, valueAfter, unitCost ; message STOCK_INSUFFICIENT sans quantité (et audit STOCK_BLIND_INSUFFICIENT_REFUSED)
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/IssueRequest"
                - $ref: "#/components/schemas/IssueRequestSingle"
      responses:
        "200":
          description: Rejeu idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlipResultEnvelope" }
        "201":
          description: Sortie enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlipResultEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/transfers:
    post:
      tags: [Mouvements]
      summary: Transférer entre deux lieux (demandeur et motif obligatoires)
      description: >
        Deux mouvements liés par transferGroupId, aucune écriture, aucune
        imputation (inchangé). Refusé vers le lieu d'un chantier clos (A7-R4),
        permis depuis ce lieu. Verrous A10 sur les deux couples.
      x-statut: modifiée
      x-permission: STOCK_TRANSFER (était FINANCE_DOCUMENTS_CREATE)
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_TRANSFER_RECORDED (critique)
      x-masquage-valeurs: value ; movements[].unitCost, totalValue, valueAfter
      x-masquage-aveugle: movements[].quantityAfter, valueAfter, unitCost pour le ou les lieux en comptage ; value si l'origine est en comptage
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: Rejeu idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResultEnvelope" }
        "201":
          description: Transfert enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResultEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/supplier-returns:
    post:
      tags: [Mouvements]
      summary: Retourner une marchandise au fournisseur (A6)
      description: >
        Facture validée ; article réceptionné sur cette facture ; quantité ≤ solde
        du lieu et ≤ reçu − déjà retourné. Écriture C311 (coût moyen) / D401
        (coût de réception de la facture) / écart 603, et mouvement « réglé » sur
        le compte de tiers du fournisseur (data-model §4).
      x-statut: nouvelle
      x-permission: STOCK_DISPOSE
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_SUPPLIER_RETURN_RECORDED (critique)
      x-masquage-valeurs: sans objet (STOCK_DISPOSE n'est attribué qu'avec STOCK_VALUES_VIEW par la migration) ; si la plateforme modifie un rôle qui l'a sans valeurs, unitCost, totalValue, valueAfter, supplierCreditValue = null
      x-masquage-aveugle: quantityAfter, valueAfter, unitCost si le lieu est en comptage et l'appelant sans STOCK_COUNT_VALIDATE
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierReturnRequest" }
      responses:
        "200":
          description: Rejeu idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementEnvelope" }
        "201":
          description: Retour enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/scraps:
    post:
      tags: [Mouvements]
      summary: Enregistrer un rebut (A6)
      description: >
        Écriture D603 / C311 au coût moyen du lieu ; aucune imputation de chantier.
        Alerte LARGE_SCRAP si la valeur atteint issueAlertAmount.
      x-statut: nouvelle
      x-permission: STOCK_DISPOSE
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_SCRAP_RECORDED (critique)
      x-masquage-valeurs: unitCost, totalValue, valueAfter (cas d'un rôle modifié par la plateforme)
      x-masquage-aveugle: quantityAfter, valueAfter, unitCost (idem retour)
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScrapRequest" }
      responses:
        "200":
          description: Rejeu idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementEnvelope" }
        "201":
          description: Rebut enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/balances:
    get:
      tags: [Mouvements]
      summary: Soldes par (article, lieu)
      x-statut: modifiée
      x-permission: STOCK_VIEW (était FINANCE_ACCOUNTS_READ)
      x-fonctionnalite: CONSTRUCTION
      x-masquage-valeurs: value, averageUnitCost
      x-masquage-aveugle: quantity, value, averageUnitCost des lieux en comptage (appelant sans STOCK_COUNT_VALIDATE) ; onlyInStock ne filtre pas ces lieux (toutes leurs lignes sont rendues, masquées)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - {
            name: locationId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: onlyInStock, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Soldes (data reste un tableau ; meta ajouté)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BalanceView" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenants/{tenantId}/finance/stock/movements:
    get:
      tags: [Mouvements]
      summary: Journal des mouvements, paginé et filtrable (A5)
      description: >
        Tri movementDate DESC, createdAt DESC, id DESC. Curseur opaque.
        Les trois filtres par personne (takerId, createdByUserId, requestedBy)
        exigent STOCK_VALUES_VIEW (403 STOCK_VALUE_FIELD_FORBIDDEN sinon).
      x-statut: modifiée
      x-permission: STOCK_VIEW (était FINANCE_ACCOUNTS_READ) ; filtres takerId, createdByUserId et requestedBy réservés à STOCK_VALUES_VIEW
      x-fonctionnalite: CONSTRUCTION
      x-masquage-valeurs: unitCost, totalValue, valueAfter, supplierCreditValue, valuationSource
      x-masquage-aveugle: quantityAfter, valueAfter, unitCost des mouvements d'un lieu en comptage
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MovementFilterItemId"
        - $ref: "#/components/parameters/MovementFilterLocationId"
        - $ref: "#/components/parameters/MovementFilterSiteId"
        - $ref: "#/components/parameters/MovementFilterType"
        - $ref: "#/components/parameters/MovementFilterSlipId"
        - $ref: "#/components/parameters/MovementFilterMovementId"
        - $ref: "#/components/parameters/MovementFilterTakerId"
        - $ref: "#/components/parameters/MovementFilterCreatedByUserId"
        - $ref: "#/components/parameters/MovementFilterRequestedBy"
        - $ref: "#/components/parameters/MovementFilterFrom"
        - $ref: "#/components/parameters/MovementFilterTo"
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        "200":
          description: Une page du journal (data reste un tableau ; curseur dans meta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MovementView" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenants/{tenantId}/finance/stock/movements/export.csv:
    get:
      tags: [Mouvements]
      summary: Export CSV du journal (mêmes filtres, sans curseur, 50 000 lignes au plus)
      description: >
        src/lib/csv.ts : BOM UTF-8, CRLF, séparateur « ; », protection contre les
        formules. Colonnes : date du mouvement ; saisi le ; délai de saisie (j) ;
        nature ; bon ; article (référence) ; désignation ; unité ; lieu ; sens ;
        quantité ; quantité après ; chantier ; poste ; preneur ou demandeur ;
        motif (code) ; motif (précision) ; facture ; auteur ; et, avec
        STOCK_VALUES_VIEW seulement : prix unitaire ; valeur ; valeur après.
        DATA_EXPORTED est écrit par le middleware d'accès (spec 023 §6).
      x-statut: nouvelle
      x-permission: "STOCK_VIEW (filtres par personne, requestedBy compris : STOCK_VALUES_VIEW)"
      x-fonctionnalite: CONSTRUCTION
      x-audit: DATA_EXPORTED (automatique)
      x-masquage-valeurs: colonnes de valeur absentes
      x-masquage-aveugle: colonnes « quantité après », « prix unitaire » et « valeur après » vides pour un lieu en comptage
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MovementFilterItemId"
        - $ref: "#/components/parameters/MovementFilterLocationId"
        - $ref: "#/components/parameters/MovementFilterSiteId"
        - $ref: "#/components/parameters/MovementFilterType"
        - $ref: "#/components/parameters/MovementFilterSlipId"
        - $ref: "#/components/parameters/MovementFilterMovementId"
        - $ref: "#/components/parameters/MovementFilterTakerId"
        - $ref: "#/components/parameters/MovementFilterCreatedByUserId"
        - $ref: "#/components/parameters/MovementFilterRequestedBy"
        - $ref: "#/components/parameters/MovementFilterFrom"
        - $ref: "#/components/parameters/MovementFilterTo"
      responses:
        "200":
          description: Fichier `journal-stock-AAAA-MM-JJ.csv` (Content-Disposition attachment)
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "Plus de 50 000 lignes : code STOCK_EXPORT_TOO_LARGE, affiner les filtres"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /tenants/{tenantId}/finance/stock/movements/authors:
    get:
      tags: [Mouvements]
      summary: Auteurs de mouvements de l'agence (alimente le filtre par utilisateur)
      x-statut: nouvelle
      x-permission: STOCK_VALUES_VIEW
      x-fonctionnalite: CONSTRUCTION
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Auteurs distincts, triés par libellé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      type: object
                      required: [userId, label]
                      properties:
                        userId: { type: string }
                        label:
                          {
                            type: string,
                            description: "fullName, à défaut e-mail",
                          }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ===========================================================================
  # Bons (B4)
  # ===========================================================================
  /tenants/{tenantId}/finance/stock/slips/{slipId}:
    get:
      tags: [Bons]
      summary: Détail d'un bon (BR, BS, PVI) avec ses mouvements et pièces jointes
      x-statut: nouvelle
      x-permission: STOCK_VIEW
      x-fonctionnalite: CONSTRUCTION
      x-masquage-valeurs: totalValue ; movements[] (champs de valeur) ; taker.phone (sans STOCK_TAKERS_MANAGE)
      x-masquage-aveugle: movements[].quantityAfter, valueAfter, unitCost (lieu en comptage)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SlipId"
      responses:
        "200":
          description: Bon
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/SlipView" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenants/{tenantId}/finance/stock/slips/{slipId}/pdf:
    get:
      tags: [Bons]
      summary: PDF du bon (régénéré, zones de signature)
      description: >
        Gabarit pdf-lib du bon de caisse (finance-sites-controller.ts:413-564),
        en-tête de document-branding.ts. Libellés imprimés lus dans
        StockSlip.snapshot (figés à l'émission, spec B4-R3), texte en français
        passé par sanitizeForPdf. Un PVI se télécharge plutôt par
        /stock/counts/{countId}/report.pdf. DOCUMENT_DOWNLOADED est écrit par le
        middleware d'accès.
      x-statut: nouvelle
      x-permission: STOCK_VIEW
      x-fonctionnalite: CONSTRUCTION
      x-audit: DOCUMENT_DOWNLOADED (automatique)
      x-masquage-valeurs: aucun montant imprimé sans STOCK_VALUES_VIEW
      x-masquage-aveugle: aucune quantité après mouvement n'est imprimée sur un bon (ni prix si le lieu est en comptage)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SlipId"
      responses:
        "200":
          description: Fichier `BS-2026-00042.pdf`
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # Inventaires (A1, A2, A3, A4, A7)
  # ===========================================================================
  /tenants/{tenantId}/finance/stock/counts:
    post:
      tags: [Inventaires]
      summary: Ouvrir un inventaire (DRAFT, à l'aveugle)
      description: >
        Un seul inventaire DRAFT ou COUNTED par lieu (index unique partiel :
        409 STOCK_COUNT_ALREADY_OPEN). OPENING (spec A7-R1) : lieu de chantier
        (kind SITE) seulement, dans les 30 jours qui suivent la bascule
        (stockEnabledAt), sinon 409 STOCK_OPENING_COUNT_NOT_ALLOWED ; un seul
        par lieu hors abandon (409 STOCK_OPENING_COUNT_EXISTS). CLOSING réservé
        au lieu d'un chantier (même code STOCK_OPENING_COUNT_NOT_ALLOWED : « nature
        interdite sur ce lieu »). La réponse liste les articles à recompter du
        lieu (toRecount).
      x-statut: modifiée
      x-permission: STOCK_COUNT (était FINANCE_DOCUMENTS_CREATE)
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_OPENED
      x-masquage-aveugle: réponse en blind = true
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCountRequest" }
      responses:
        "201":
          description: Inventaire ouvert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Inventaires]
      summary: Lister les inventaires
      x-statut: modifiée
      x-permission: STOCK_VIEW (était FINANCE_ACCOUNTS_READ)
      x-fonctionnalite: CONSTRUCTION
      x-masquage-valeurs: countedValue, varianceValueGross, varianceValueNet, setAsideVarianceValue, lines[].varianceValue, lines[].unitCostAtValidation
      x-masquage-aveugle: pour tout inventaire DRAFT, à tous — lines[].expectedQuantity, lines[].variance, varianceCount, toutes les valeurs d'écart
      description: >
        Sans withLines=true, chaque inventaire est rendu avec lines = [] (le
        compte reste dans linesCount) : la liste n'a pas besoin des lignes
        (question Q13 des écrans). Le détail se lit par /stock/counts/{countId}.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - {
            name: locationId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/CountStatus" },
          }
        - {
            name: kind,
            in: query,
            schema: { $ref: "#/components/schemas/CountKind" },
          }
        - {
            name: withLines,
            in: query,
            schema: { type: boolean, default: false },
          }
      responses:
        "200":
          description: Inventaires
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CountView" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/lines:
    put:
      tags: [Inventaires]
      summary: Saisir ou ressaisir le comptage d'un article (DRAFT)
      description: >
        Fige expectedQuantity et expectedCapturedAt (jamais renvoyés), enregistre
        l'auteur, l'heure serveur et countedBlind (faux si l'appelant détient
        STOCK_COUNT_VALIDATE), ajoute l'appelant à counterUserIds (jamais
        retiré). Le champ reason est refusé (400 : « Le motif se saisit après la
        clôture du comptage »).
      x-statut: modifiée
      x-permission: STOCK_COUNT
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_LINE_RECORDED (quantité avant et après)
      x-masquage-aveugle: la réponse ne contient que la ligne saisie, sans attendu ni écart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCountLineRequest" }
      responses:
        "200":
          description: Ligne saisie (ou rejeu idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/CountLineView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/lines/{itemId}:
    delete:
      tags: [Inventaires]
      summary: Retirer une ligne d'un inventaire en cours (DRAFT seulement)
      description: Son auteur reste compteur de l'inventaire (spec A1-R1).
      x-statut: modifiée
      x-permission: STOCK_COUNT (était FINANCE_DOCUMENTS_CREATE)
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_LINE_REMOVED
      x-masquage-aveugle: réponse blind = true
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Inventaire après retrait
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/close:
    post:
      tags: [Inventaires]
      summary: Clore le comptage (DRAFT → COUNTED) ; les écarts deviennent visibles
      description: >
        Refusée sans ligne (409 STOCK_COUNT_EMPTY), sauf CLOSING d'un lieu dont
        tous les soldes sont nuls. Crée, sous les verrous A10 du lieu, une ligne
        « non comptée » (countedQuantity null, attendu figé) pour chaque article
        de solde non nul sans ligne (spec A2-R8). Pour OPENING et CLOSING,
        refusée tant qu'un tel article existe : 409 STOCK_COUNT_INCOMPLETE,
        data.items.
      x-statut: nouvelle
      x-permission: STOCK_COUNT
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_CLOSED (critique)
      x-masquage-valeurs: champs de valeur de CountView
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              { type: object, additionalProperties: false, properties: {} }
      responses:
        "200":
          description: Inventaire clos, écarts révélés
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/lines/{itemId}/justification:
    put:
      tags: [Inventaires]
      summary: Justifier l'écart d'une ligne (COUNTED)
      x-statut: nouvelle
      x-permission: STOCK_COUNT ou STOCK_COUNT_VALIDATE (requireAnyPermission, rbac-middleware.ts:92)
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_LINE_JUSTIFIED
      x-masquage-valeurs: varianceValue, unitCostAtValidation
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JustifyLineRequest" }
      responses:
        "200":
          description: Ligne justifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/CountLineView" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/lines/{itemId}/set-aside:
    post:
      tags: [Inventaires]
      summary: Écarter une ligne d'un inventaire clos (non ajustée, imprimée au PV)
      x-statut: nouvelle
      x-permission: STOCK_COUNT_VALIDATE
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_LINE_SET_ASIDE (critique, payload avec attendu et compté)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonOnlyRequest" }
      responses:
        "200":
          description: Inventaire après mise à l'écart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/set-aside-uncounted:
    post:
      tags: [Inventaires]
      summary: Écarter d'un coup toutes les lignes non comptées d'un inventaire clos (motif commun)
      description: >
        Inventaire tournant ou article volontairement non compté (spec A2-R8) :
        c'est le validateur, jamais le compteur, qui décide de ne pas compter.
        Écrit une ligne d'audit listant les articles. Sans ligne non comptée :
        200, rien ne change.
      x-statut: nouvelle
      x-permission: STOCK_COUNT_VALIDATE
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_LINE_SET_ASIDE (critique, une ligne d'audit, articles listés)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonOnlyRequest" }
      responses:
        "200":
          description: Inventaire après mise à l'écart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/validate:
    post:
      tags: [Inventaires]
      summary: Valider (COUNTED → VALIDATED) ; les écarts deviennent des ajustements
      description: >
        Exige le statut COUNTED (un DRAFT répond 409 STOCK_COUNT_WRONG_STATUS :
        clore d'abord). Lignes non comptées non écartées → 409
        STOCK_COUNT_UNCOUNTED_LINES (data.items). A1 (aucun des compteurs —
        counterUserIds — ne valide ; dérogation testée en base), A3 (écart
        appliqué au solde courant), A4 (motif typé exigé, motif libre d'avant le
        lot accepté). Fige countedValue, varianceValueGross/Net,
        setAsideVarianceValue, unitCostAtValidation, movementsSinceCapture
        (null pour une ligne d'avant le lot). Tire le numéro PVI. Alertes
        COUNT_VARIANCE (lignes écartées comprises, surplus d'ouverture exclus),
        COUNT_LINE_SET_ASIDE (au moins une ligne écartée ou non comptée) et, en
        dérogation, COUNT_SELF_VALIDATED.
      x-statut: modifiée
      x-permission: STOCK_COUNT_VALIDATE (était FINANCE_DOCUMENTS_VALIDATE)
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_VALIDATED (critique) ; STOCK_COUNT_SELF_VALIDATED (critique) en dérogation
      x-masquage-valeurs: champs de valeur de CountView (sans objet pour les rôles système)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateCountRequest" }
      responses:
        "200":
          description: Inventaire validé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/cancel:
    post:
      tags: [Inventaires]
      summary: Abandonner un inventaire en cours (DRAFT → CANCELLED)
      description: >
        Les routes de lecture ne révèlent jamais ses attendus. L'audit porte
        attendu et compté de chaque ligne ; avec au moins une ligne, alerte
        COUNT_CANCELLED (spec A2-R6).
      x-statut: nouvelle
      x-permission: STOCK_COUNT_VALIDATE
      x-fonctionnalite: CONSTRUCTION
      x-audit: STOCK_COUNT_CANCELLED (critique, attendu et compté par ligne)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonOnlyRequest" }
      responses:
        "200":
          description: Inventaire abandonné (reste aveugle)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tenants/{tenantId}/finance/stock/counts/{countId}/report.pdf:
    get:
      tags: [Inventaires]
      summary: Procès-verbal d'inventaire (VALIDATED seulement)
      description: >
        Compteurs (counterUserIds), validateur, mention de dérogation, lignes
        ajustées, écartées et non comptées, mention « comptée sans aveugle »,
        mouvements postérieurs au comptage (« non mesuré » pour une ligne
        d'avant le lot), zones de signature ; libellés figés (snapshot du PVI).
        Inventaire validé avant le lot : PDF sans numéro (spec B4-R3 bis).
        Monté avant toute route GET /stock/counts/{countId} plus générique ; le
        segment fixe empêche toute capture (finance-stock-inventaire-routes.ts:52-65).
      x-statut: nouvelle
      x-permission: STOCK_VIEW
      x-fonctionnalite: CONSTRUCTION
      x-audit: DOCUMENT_DOWNLOADED (automatique)
      x-masquage-valeurs: aucun montant imprimé sans STOCK_VALUES_VIEW
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
      responses:
        "200":
          description: Fichier `PVI-2026-00007.pdf`
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Inventaire non validé (DRAFT, COUNTED, CANCELLED) : STOCK_COUNT_WRONG_STATUS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /tenants/{tenantId}/finance/stock/counts/{countId}:
    get:
      tags: [Inventaires]
      summary: Détail d'un inventaire (dernière route déclarée sous /stock/counts/)
      x-statut: modifiée
      x-permission: STOCK_VIEW (était FINANCE_ACCOUNTS_READ)
      x-fonctionnalite: CONSTRUCTION
      x-masquage-valeurs: countedValue, varianceValueGross, varianceValueNet, setAsideVarianceValue, lines[].varianceValue, lines[].unitCostAtValidation
      x-masquage-aveugle: DRAFT et CANCELLED — expectedQuantity, variance, varianceCount et valeurs à null pour tous, blind = true
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CountId"
      responses:
        "200":
          description: Inventaire
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

