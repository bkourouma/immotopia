<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00215e" />
    <title>ImmoTopia — Hors ligne</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#00215e;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
      main{max-width:360px}
      img{width:96px;height:96px;border-radius:20px}
      h1{font-size:1.25rem;margin:16px 0 8px}
      p{margin:0 0 20px;color:#475569;line-height:1.5}
      button{background:#c2410c;color:#fff;border:0;border-radius:8px;padding:12px 24px;font-size:1rem;font-weight:600;cursor:pointer;min-height:44px}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="t">Vous êtes hors ligne</h1>
      <p id="m">ImmoTopia a besoin d'une connexion pour afficher vos données. Vérifiez votre réseau puis réessayez.</p>
      <button id="b" type="button">Réessayer</button>
    </main>
    <script>
      var L = {
        en: ["You are offline", "ImmoTopia needs a connection to show your data. Check your network and try again.", "Try again"],
        ar: ["أنت غير متصل بالإنترنت", "يحتاج ImmoTopia إلى اتصال لعرض بياناتك. تحقق من الشبكة ثم أعد المحاولة.", "إعادة المحاولة"]
      };
      var code = (navigator.language || "fr").slice(0, 2);
      if (L[code]) {
        document.documentElement.lang = code;
        if (code === "ar") document.documentElement.dir = "rtl";
        document.getElementById("t").textContent = L[code][0];
        document.getElementById("m").textContent = L[code][1];
        document.getElementById("b").textContent = L[code][2];
      }
      document.getElementById("b").addEventListener("click", function () { location.href = "/"; });
      window.addEventListener("online", function () { location.href = "/"; });
    </script>
  </body>
</html>
