<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket de maintenance créé</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background: #fff7e6; border: 1px solid #ffd591; padding: 20px; border-radius: 8px;">
    <h2 style="color: #fa8c16; margin-top: 0;">Ticket de maintenance enregistré</h2>
    <p>Bonjour {{contactName}},</p>
    <p>Votre demande de maintenance a bien été enregistrée.</p>
    <ul>
      <li><strong>Référence ticket :</strong> {{ticketId}}</li>
      <li><strong>Sujet :</strong> {{subject}}</li>
      <li><strong>Priorité :</strong> {{priority}}</li>
    </ul>
    <p>Nous vous tiendrons informé de l'évolution de votre dossier.</p>
    <p>Cordialement,<br/>{{tenant_name}}</p>
  </div>
</body>
</html>
