<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fin de bail prochaine</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background: #fff1f0; border: 1px solid #ffa39e; padding: 20px; border-radius: 8px;">
    <h2 style="color: #cf1322; margin-top: 0;">Fin de bail prochaine</h2>
    <p>Bonjour {{contactName}},</p>
    <p>Nous vous informons que votre bail arrive à échéance le <strong>{{endDate}}</strong>.</p>
    <ul>
      <li><strong>Référence bail :</strong> {{leaseId}}</li>
    </ul>
    <p>Pour toute question (renouvellement, état des lieux, restitution des clés), n'hésitez pas à nous contacter.</p>
    <p>Cordialement,<br/>{{tenant_name}}</p>
  </div>
</body>
</html>
