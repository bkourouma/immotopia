<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement reçu</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background: #f6ffed; border: 1px solid #b7eb8f; padding: 20px; border-radius: 8px;">
    <h2 style="color: #52c41a; margin-top: 0;">Confirmation de paiement reçu</h2>
    <p>Bonjour,</p>
    <p>Nous vous confirmons la réception de votre paiement.</p>
    <ul>
      <li><strong>Montant :</strong> {{amount}} {{currency}}</li>
      <li><strong>Référence :</strong> {{paymentId}}</li>
      <li><strong>Bail :</strong> {{leaseId}}</li>
    </ul>
    <p>Merci pour votre confiance.</p>
    <p>Cordialement,<br/>{{tenant_name}}</p>
  </div>
</body>
</html>
