# Mises a jour automatiques de dependances (FRI-12). Hebdomadaire, groupees pour
# limiter le nombre de PR ; les montees majeures restent des PR individuelles.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/packages/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/compose"
    schedule:
      interval: "weekly"
