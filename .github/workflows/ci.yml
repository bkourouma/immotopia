name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  api:
    name: API — typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: immotopia
          POSTGRES_PASSWORD: immotopia
          POSTGRES_DB: immotopia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immotopia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://immotopia:immotopia@localhost:5432/immotopia_test?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Single install for the whole workspace: one lockfile at the root.
      - run: npm ci

      - run: npm run prisma:generate -w @immotopia/api

      # Fails when the Prisma schema and the migration history have drifted
      # apart, which is how the schema/DB mismatch in AUDIT_CODE.md crept in.
      - name: Check migrations match the schema
        working-directory: packages/api
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
        continue-on-error: true

      # continue-on-error while the pre-existing backlog is paid down
      # (148 type errors, see AUDIT_CODE.md §3.7). Flip both to blocking once
      # the count reaches zero.
      - run: npm run typecheck -w @immotopia/api
        continue-on-error: true

      - run: npm run lint -w @immotopia/api
        continue-on-error: true

      # Blocking: the test suite must stay green.
      - run: npm test -w @immotopia/api

  # Le runner GitHub n'a que 4 vCPU. Les 78 fichiers de test montent chacun un
  # jsdom et de vrais composants Ant Design : sur une seule machine, avec
  # 4 workers, la suite prenait 23 min et une vingtaine de tests expiraient
  # (aucune assertion fausse, que des « Test timed out »), alors qu'ils passent
  # en local. Quatre lots sur quatre runners, deux workers chacun : chaque test
  # retrouve le temps processeur qu'il a en local.
  web-tests:
    name: Web — tests (lot ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # `vitest run` is single-shot; no watch flag needed.
      - run: npm run test -w @immotopia/web -- --shard=${{ matrix.shard }}/4 --maxWorkers=2 --minWorkers=1

  web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Blocking: the frontend currently type-checks cleanly, keep it that way.
      - run: npm run typecheck -w @immotopia/web

      # continue-on-error: ESLint had never run on this codebase before, so the
      # first pass carries a large warning backlog.
      - run: npm run lint -w @immotopia/web
        continue-on-error: true

      # Les tests frontend tournent dans le job `web-tests`, découpé en lots.

      # `build` runs tsc --noEmit then vite build.
      - run: npm run build -w @immotopia/web

      # Critère de sortie du Lot 1 (§9) : aucun mot de passe dans le bundle de
      # production. Les neuf comptes de test de Login.tsx étaient servis à tout
      # visiteur, l'écran étant le seul importé statiquement. Le grep porte sur
      # le bundle construit, pas sur les sources : c'est ce qui part en ligne.
      - name: Aucun identifiant en clair dans le bundle
        run: |
          if grep -rIlE '(Admin@|Test@|P@ssw0rd)' apps/web/build/assets/; then
            echo "::error::Un identifiant en clair a ete trouve dans le bundle de production."
            exit 1
          fi
          echo "Aucun identifiant en clair dans le bundle."

      # L'atelier de vérification visuelle (`src/dev/`) ne doit jamais partir en
      # production : il porte des données simulées et court-circuite l'API.
      # Sa garde est `import.meta.env.DEV` posée sur l'import lui-même. Poser
      # cette garde sur la seule route laissait passer un chunk `Atelier-*.js`
      # complet dans le bundle — constaté, puis corrigé. Ce grep empêche la
      # régression, que la garde ne peut pas signaler d'elle-même.
      - name: L'atelier ne part pas en production
        run: |
          if grep -rIlE '(agence-demo|installerFausseApi)' apps/web/build/assets/; then
            echo "::error::L'atelier de developpement se retrouve dans le bundle de production."
            exit 1
          fi
          echo "Aucune trace de l'atelier dans le bundle."

      # Le chunk d'entrée reste sous le plafond du §8.1. Le script lit
      # `index.html` pour identifier l'entrée : six fichiers du build s'appellent
      # `index-<hash>.js`, et mesurer le mauvais a déjà masqué une dérive.
      - name: Budget du chunk d'entree
        run: npm run measure:entry -w @immotopia/web

      # Les tokens du §3.2 doivent rester conformes AA.
      - run: npm run a11y:contrast
