# Environnement STAGING : app.immotopia.cloud (pile historique immotopia-saas).
#
# Fichier bash sourcable par deploy.sh, backup.sh, make-env.sh... NON secret :
# aucune cle, aucun mot de passe ici (ils vivent dans IMMOTOPIA_ENV_FILE, hors
# depot). Chaque variable reste surchargeable depuis l'environnement (tests
# locaux) grace a la forme : "${VAR:=defaut}".

: "${STACK_NAME:=immotopia-saas}"
: "${IMMOTOPIA_ENV_FILE:=/home/deployer/immotopia-saas.env}"
: "${PUBLIC_ORIGIN:=https://app.immotopia.cloud}"
: "${WEB_PORT:=3019}"
: "${PG_PORT:=5436}"
# Compile dans le bundle du front : panneau « Comptes par tenant » de l'ecran
# de connexion. Visible en staging, jamais en production.
: "${VITE_SHOW_DEMO_ACCOUNTS:=true}"
: "${BACKUP_DIR:=/home/deployer/backups/${STACK_NAME}}"
: "${BACKUP_KEEP_DAYS:=14}"
