# Environnement PRODUCTION : clients.immotopia.cloud (pile immotopia-prod).
#
# Fichier bash sourcable par deploy.sh, backup.sh, make-env.sh... NON secret :
# aucune cle, aucun mot de passe ici (ils vivent dans IMMOTOPIA_ENV_FILE, hors
# depot). Chaque variable reste surchargeable depuis l'environnement (tests
# locaux) grace a la forme : "${VAR:=defaut}".
#
# Base, volumes, reseau, secrets et ports sont distincts du staging
# (immotopia-saas, 3019 / 5436) qui tourne sur le meme serveur.

: "${STACK_NAME:=immotopia-prod}"
: "${IMMOTOPIA_ENV_FILE:=/home/deployer/immotopia-prod.env}"
: "${PUBLIC_ORIGIN:=https://clients.immotopia.cloud}"
: "${WEB_PORT:=3020}"
: "${PG_PORT:=5437}"
# Jamais de comptes de demonstration affiches en production.
: "${VITE_SHOW_DEMO_ACCOUNTS:=false}"
: "${BACKUP_DIR:=/home/deployer/backups/${STACK_NAME}}"
: "${BACKUP_KEEP_DAYS:=14}"
