# nginx EMBARQUE dans l'image web de la pile (immotopia-saas-web en staging,
# immotopia-prod-web en production).
# Il sert le SPA compile et proxifie l'API. Il n'est joignable que par le nginx
# de l'hote, via 127.0.0.1:${WEB_PORT} (3019 en staging, 3020 en production).
#
# Le meme fichier sert les deux piles : l'API est visee par son NOM DE SERVICE
# Compose (`api`), que le DNS interne du reseau de chaque pile resout vers le
# conteneur de cette pile uniquement. Ne jamais y ecrire un nom de conteneur.

# --- Journal sans jeton de signature (spec 044) ---------------------------
# Le lien envoye au signataire (/signer/<jeton>) et l'API publique
# (/api/public/signatures/<jeton>) portent un jeton secret dans le chemin :
# il ne doit pas finir en clair dans les journaux d'acces. Les directives
# map et log_format ci-dessous sont valides au niveau du fichier, car conf.d de nginx est inclus dans le contexte http (nginx embarque dans l'image web).
# Le journal d'erreurs peut citer la ligne de requete lors d'une erreur amont :
# voir docs/workflows/DEPLOIEMENT.md (limites).
map $request_uri $web_uri_masked {
    default $request_uri;
    "~^(?<wb_a>/signer/)[^/?]+(?<wb_b>.*)$" "${wb_a}[masque]${wb_b}";
    "~^(?<wb_c>/api/public/signatures/)[^/?]+(?<wb_d>.*)$" "${wb_c}[masque]${wb_d}";
}
map $http_referer $web_referer_masked {
    default $http_referer;
    "~^(?<wb_e>https?://[^/]+/signer/)[^/?#]+(?<wb_f>.*)$" "${wb_e}[masque]${wb_f}";
}
# Jeton en query string (AUTH-04) : verification d'e-mail
# (/verify-email?token=...), confirmation et desinscription de newsletter
# (?token=...) et tout autre parametre dont le nom finit par « token » ne
# doivent pas finir en clair dans les journaux d'acces. Le masquage est
# ITERATIF : trois passes de map chainees (URI : web_uri_masked -> web_uri_t1 -> web_uri_t2 -> web_uri_logged ;
# Referer : meme chaine en web_referer_*), chacune masquant la premiere occurrence pas encore masquee
# (lookahead negatif sur « [masque] »). Les noms de variables et de captures sont distincts
# (aucun doublon dans le contexte http) et propres a ce fichier. Le Referer est masque aussi, car une
# page same-origin le transmet en entier a l'API.
# LIMITE : au-dela de TROIS parametres dont le nom finit par « token » dans une meme URL,
# les suivants restent en clair dans le journal.
map $web_uri_masked $web_uri_t1 {
    default $web_uri_masked;
    "~*^(?<wb_g>.*?[?&][a-z_]*token=)(?!\[masque\])[^&]*(?<wb_h>.*)$" "${wb_g}[masque]${wb_h}";
}
map $web_uri_t1 $web_uri_t2 {
    default $web_uri_t1;
    "~*^(?<wb_i>.*?[?&][a-z_]*token=)(?!\[masque\])[^&]*(?<wb_j>.*)$" "${wb_i}[masque]${wb_j}";
}
map $web_uri_t2 $web_uri_logged {
    default $web_uri_t2;
    "~*^(?<wb_k>.*?[?&][a-z_]*token=)(?!\[masque\])[^&]*(?<wb_l>.*)$" "${wb_k}[masque]${wb_l}";
}
map $web_referer_masked $web_referer_t1 {
    default $web_referer_masked;
    "~*^(?<wb_m>.*?[?&][a-z_]*token=)(?!\[masque\])[^&#]*(?<wb_n>.*)$" "${wb_m}[masque]${wb_n}";
}
map $web_referer_t1 $web_referer_t2 {
    default $web_referer_t1;
    "~*^(?<wb_o>.*?[?&][a-z_]*token=)(?!\[masque\])[^&#]*(?<wb_p>.*)$" "${wb_o}[masque]${wb_p}";
}
map $web_referer_t2 $web_referer_logged {
    default $web_referer_t2;
    "~*^(?<wb_q>.*?[?&][a-z_]*token=)(?!\[masque\])[^&#]*(?<wb_r>.*)$" "${wb_q}[masque]${wb_r}";
}
log_format immotopia_web_masked '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $web_uri_logged $server_protocol" '
                       '$status $body_bytes_sent "$web_referer_logged" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La plus grosse limite multer du code est 50 Mo
    # (packages/api/src/middleware/upload-middleware.ts:62). 60 Mo laisse la
    # marge du surcout multipart. La meme valeur est posee sur le vhost hote.
    client_max_body_size 60m;

    # Journal d'acces sans jeton de signature (voir le bloc map ci-dessus).
    access_log /var/log/nginx/access.log immotopia_web_masked;

    # En-tetes de securite. ATTENTION : dans nginx, un `add_header` pose dans un
    # `location` ANNULE l'heritage de tous ceux du niveau superieur. Les cinq
    # lignes sont donc REPETEES dans chaque bloc qui definit deja un add_header
    # (/healthz, /assets/, /fonts/, icones, /index.html). Tout nouveau location
    # avec add_header doit faire de meme.
    #
    # Content-Security-Policy-Report-Only : politique de DEPART, en observation
    # seule (aucune ressource n'est bloquee) ; la passer en Content-Security-Policy
    # apres une periode sans violation. 'unsafe-inline' n'est admis que pour les
    # styles (Ant Design). Aucun report-uri n'est configure : les violations se
    # lisent dans la console du navigateur.
    # frame-ancestors est volontairement ABSENT de la valeur Report-Only : le
    # navigateur l'ignore dans cet en-tete. A AJOUTER (frame-ancestors 'self')
    # quand la CSP passera en Content-Security-Policy (enforce).
    # Permissions-Policy : camera et micro restent permis a l'application seule
    # (visio d'assemblee generale LiveKit, capture terrain) ; geolocalisation,
    # paiement navigateur et USB sont coupes (aucun usage dans apps/web/src).
    # Strict-Transport-Security n'est PAS pose ici : ce fichier est servi en HTTP
    # clair derriere le nginx de l'hote ; il se pose dans le bloc TLS du vhost
    # hote (infra/nginx/*.immotopia.cloud.conf).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;


    # Compression du HTML/JS/CSS. Les .woff2 sont deja compresses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Sonde du HEALTHCHECK de l'image : ne doit jamais toucher l'API.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        return 200 "ok\n";
    }

    # --- API Express -------------------------------------------------------
    #
    # X-Forwarded-For est RECOPIE, pas complete ($http_x_forwarded_for et non
    # $proxy_add_x_forwarded_for). L'API fait `app.set('trust proxy', 1)`
    # (packages/api/src/app.ts:91), donc elle ne remonte qu'UN saut. Comme il
    # y a deux proxys (nginx hote -> nginx conteneur -> Express), completer la
    # chaine ferait voir a Express l'IP de la passerelle Docker au lieu de
    # celle du client : le limiteur de connexion (5 essais / 15 min par IP)
    # mettrait alors tous les utilisateurs dans le meme seau.
    location /api/ {
        proxy_pass http://api:8001;
        # Helmet pose deja ces en-tetes : on retire ceux de l'API pour que
        # les en-tetes du serveur (ci-dessus) ne fassent pas doublon. (Le
        # Content-Security-Policy enforce de Helmet, lui, est conserve.)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # --- Fichiers televerses, servis par Express ---------------------------
    #
    # /uploads n'est PAS statique : uploads-access-middleware.ts exige une
    # session valide pour les documents prives. Le cookie et l'en-tete
    # Authorization doivent donc traverser le proxy (ils le font par defaut).
    location /uploads/ {
        proxy_pass http://api:8001;
        # Helmet pose deja ces en-tetes : on retire ceux de l'API pour que
        # les en-tetes du serveur (ci-dessus) ne fassent pas doublon. (Le
        # Content-Security-Policy enforce de Helmet, lui, est conserve.)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8001/health;
        # Helmet pose deja ces en-tetes : on retire ceux de l'API pour que
        # les en-tetes du serveur (ci-dessus) ne fassent pas doublon. (Le
        # Content-Security-Policy enforce de Helmet, lui, est conserve.)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- SPA ---------------------------------------------------------------

    # Noms de fichiers hashes par Vite : immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # Les icones sont de vrais fichiers, deposes par apps/web/public/.
    # Sans ce bloc, elles retombent sur `try_files ... /index.html` plus bas et
    # un navigateur qui demande /favicon.ico recoit index.html en text/html —
    # exactement le defaut corrige ici. Le =404 garantit qu'une icone manquante
    # reste une icone manquante, et ne redevient jamais une page HTML.
    # L'extension est volontairement laissee ouverte (favicon\.[a-z]+) : un
    # navigateur qui reclame un favicon.svg ou favicon.png qu'on ne publie pas
    # doit recevoir 404, pas index.html. Restreindre la regex aux seules
    # extensions publiees rouvrirait le defaut pour toutes les autres.
    location ~* ^/(favicon\.[a-z0-9]+|favicon-\d+\.png|apple-touch-icon[\w-]*\.png)$ {
        try_files $uri =404;
        # Nom de fichier non hashe : duree moyenne, pour pouvoir changer le logo
        # sans laisser une icone perimee des mois dans les caches.
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # --- PWA ----------------------------------------------------------------
    # Le service worker ne doit JAMAIS etre servi depuis un cache HTTP : sinon
    # une nouvelle version n'est detectee qu'apres expiration. Meme regle pour la
    # page de repli hors ligne, relue a chaque installation du worker.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location = /hors-ligne.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # Manifeste et icones d'installation : noms non haches, duree moyenne.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location /icons/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # index.html ne doit JAMAIS etre mis en cache : il porte les references
    # vers les bundles hashes du deploiement courant.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # Routage React Router cote client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
