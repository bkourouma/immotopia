# nginx EMBARQUE dans l'image immotopia-saas-web.
# Il sert le SPA compile et proxifie l'API. Il n'est joignable que par le nginx
# de l'hote, via 127.0.0.1:3019.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La plus grosse limite multer du code est 50 Mo
    # (packages/api/src/middleware/upload-middleware.ts:62). 60 Mo laisse la
    # marge du surcout multipart. La meme valeur est posee sur le vhost hote.
    client_max_body_size 60m;

    # Compression du HTML/JS/CSS. Les .woff2 sont deja compresses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Sonde du HEALTHCHECK de l'image : ne doit jamais toucher l'API.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- API Express -------------------------------------------------------
    #
    # X-Forwarded-For est RECOPIE, pas complete ($http_x_forwarded_for et non
    # $proxy_add_x_forwarded_for). L'API fait `app.set('trust proxy', 1)`
    # (packages/api/src/index.ts:50), donc elle ne remonte qu'UN saut. Comme il
    # y a deux proxys (nginx hote -> nginx conteneur -> Express), completer la
    # chaine ferait voir a Express l'IP de la passerelle Docker au lieu de
    # celle du client : le limiteur de connexion (5 essais / 15 min par IP)
    # mettrait alors tous les utilisateurs dans le meme seau.
    location /api/ {
        proxy_pass http://immotopia-saas-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # --- Fichiers televerses, servis par Express ---------------------------
    #
    # /uploads n'est PAS statique : uploads-access-middleware.ts exige une
    # session valide pour les documents prives. Le cookie et l'en-tete
    # Authorization doivent donc traverser le proxy (ils le font par defaut).
    location /uploads/ {
        proxy_pass http://immotopia-saas-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://immotopia-saas-api:8001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- SPA ---------------------------------------------------------------

    # Noms de fichiers hashes par Vite : immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Les icones sont de vrais fichiers, deposes par apps/web/public/.
    # Sans ce bloc, elles retombent sur `try_files ... /index.html` plus bas et
    # un navigateur qui demande /favicon.ico recoit index.html en text/html —
    # exactement le defaut corrige ici. Le =404 garantit qu'une icone manquante
    # reste une icone manquante, et ne redevient jamais une page HTML.
    # L'extension est volontairement laissee ouverte (favicon\.[a-z]+) : un
    # navigateur qui reclame un favicon.svg ou favicon.png qu'on ne publie pas
    # doit recevoir 404, pas index.html. Restreindre la regex aux seules
    # extensions publiees rouvrirait le defaut pour toutes les autres.
    location ~* ^/(favicon\.[a-z0-9]+|favicon-\d+\.png|apple-touch-icon[\w-]*\.png)$ {
        try_files $uri =404;
        # Nom de fichier non hashe : duree moyenne, pour pouvoir changer le logo
        # sans laisser une icone perimee des mois dans les caches.
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # index.html ne doit JAMAIS etre mis en cache : il porte les references
    # vers les bundles hashes du deploiement courant.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Routage React Router cote client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
