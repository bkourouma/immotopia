# Vhost de l'HOTE pour https://clients.immotopia.cloud  --  environnement PRODUCTION
#
# clients.immotopia.cloud est la PRODUCTION (pile immotopia-prod, 127.0.0.1:3020).
# Le vhost app.immotopia.cloud est le STAGING (pile immotopia-saas, 3019) : voir
# infra/nginx/app.immotopia.cloud.conf. Ne jamais pointer l'un vers l'autre.
#
# ------------------------------------------------------------------------
# CE VHOST NE CONCERNE QUE LE SOUS-DOMAINE clients.immotopia.cloud.
#
# Le vhost immotopia.cloud / www.immotopia.cloud existant est un AUTRE projet :
# site public statique servi depuis /var/www/immotopia-app/apps/public-site/dist
# avec une API sur 127.0.0.1:3004. Il ne doit pas etre touche, et son certificat
# (immotopia.cloud + immotopia.immo-annonces.fr) ne couvre pas clients.*.
# clients.immotopia.cloud recoit donc son PROPRE certificat (ni celui de app.*).
# ------------------------------------------------------------------------
#
# Ce fichier est la version HTTP SEULE, celle qu'on installe en premier pour
# que certbot puisse repondre au challenge HTTP-01. Ensuite :
#
#   sudo certbot --nginx -d clients.immotopia.cloud --agree-tos \
#        -m admin@immotopia.cloud --no-eff-email --redirect
#
# certbot reecrit ce fichier en place : il ajoute le bloc `listen 443 ssl`, les
# directives ssl_certificate et la redirection 301 depuis le port 80. Ne pas
# recopier ce fichier par-dessus apres coup, sinon le TLS saute.

# --- Journal sans jeton de signature (spec 044) ---------------------------
# Le lien envoye au signataire (/signer/<jeton>) et l'API publique
# (/api/public/signatures/<jeton>) portent un jeton secret dans le chemin :
# il ne doit pas finir en clair dans les journaux d'acces. Les directives
# map et log_format ci-dessous sont valides au niveau du fichier, car les fichiers de sites-enabled sont inclus dans le contexte http. Noms propres a ce fichier (pas de collision avec l'autre environnement).
# Le journal d'erreurs peut citer la ligne de requete lors d'une erreur amont :
# voir docs/workflows/DEPLOIEMENT.md (limites).
map $request_uri $prod_uri_masked {
    default $request_uri;
    "~^(?<pr_a>/signer/)[^/?]+(?<pr_b>.*)$" "${pr_a}[masque]${pr_b}";
    "~^(?<pr_c>/api/public/signatures/)[^/?]+(?<pr_d>.*)$" "${pr_c}[masque]${pr_d}";
}
map $http_referer $prod_referer_masked {
    default $http_referer;
    "~^(?<pr_e>https?://[^/]+/signer/)[^/?#]+(?<pr_f>.*)$" "${pr_e}[masque]${pr_f}";
}
# Jeton en query string (AUTH-04) : verification d'e-mail
# (/verify-email?token=...), confirmation et desinscription de newsletter
# (?token=...) et tout autre parametre dont le nom finit par « token » (lettres,
# « _ » et « . » : hub.verify_token du webhook Meta compris) ne
# doivent pas finir en clair dans les journaux d'acces. Le masquage est
# ITERATIF : trois passes de map chainees (URI : prod_uri_masked -> prod_uri_t1 -> prod_uri_t2 -> prod_uri_logged ;
# Referer : meme chaine en prod_referer_*), chacune masquant la premiere occurrence pas encore masquee
# (lookahead negatif sur « [masque] »). Les noms de variables et de captures sont distincts
# (aucun doublon dans le contexte http) et propres a ce fichier. Le Referer est masque aussi, car une
# page same-origin le transmet en entier a l'API.
# LIMITE : au-dela de TROIS parametres dont le nom finit par « token » dans une meme URL,
# les suivants restent en clair dans le journal.
map $prod_uri_masked $prod_uri_t1 {
    default $prod_uri_masked;
    "~*^(?<pr_g>.*?[?&][a-z_.]*token=)(?!\[masque\])[^&]*(?<pr_h>.*)$" "${pr_g}[masque]${pr_h}";
}
map $prod_uri_t1 $prod_uri_t2 {
    default $prod_uri_t1;
    "~*^(?<pr_i>.*?[?&][a-z_.]*token=)(?!\[masque\])[^&]*(?<pr_j>.*)$" "${pr_i}[masque]${pr_j}";
}
map $prod_uri_t2 $prod_uri_logged {
    default $prod_uri_t2;
    "~*^(?<pr_k>.*?[?&][a-z_.]*token=)(?!\[masque\])[^&]*(?<pr_l>.*)$" "${pr_k}[masque]${pr_l}";
}
map $prod_referer_masked $prod_referer_t1 {
    default $prod_referer_masked;
    "~*^(?<pr_m>.*?[?&][a-z_.]*token=)(?!\[masque\])[^&#]*(?<pr_n>.*)$" "${pr_m}[masque]${pr_n}";
}
map $prod_referer_t1 $prod_referer_t2 {
    default $prod_referer_t1;
    "~*^(?<pr_o>.*?[?&][a-z_.]*token=)(?!\[masque\])[^&#]*(?<pr_p>.*)$" "${pr_o}[masque]${pr_p}";
}
map $prod_referer_t2 $prod_referer_logged {
    default $prod_referer_t2;
    "~*^(?<pr_q>.*?[?&][a-z_.]*token=)(?!\[masque\])[^&#]*(?<pr_r>.*)$" "${pr_q}[masque]${pr_r}";
}
log_format immotopia_prod_masked '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $prod_uri_logged $server_protocol" '
                       '$status $body_bytes_sent "$prod_referer_logged" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name clients.immotopia.cloud;

    # Journaux dedies : ne pas polluer ceux des autres applications.
    access_log /var/log/nginx/clients.immotopia.cloud.access.log immotopia_prod_masked;
    error_log  /var/log/nginx/clients.immotopia.cloud.error.log;

    # Doit rester >= a la plus grosse limite multer du code (50 Mo,
    # packages/api/src/middleware/upload-middleware.ts:62) et alignee avec le
    # nginx embarque dans l'image web (infra/nginx/spa.conf).
    client_max_body_size 60m;


    # TLS : Strict-Transport-Security (AUTH-06). A POSER A LA MAIN dans le bloc
    # `server` qui ecoute en 443 (certbot reecrit ce fichier : le bloc 443 n'existe
    # pas ici), jamais dans le bloc HTTP du port 80 ; `always` pour qu'il
    # accompagne aussi les reponses d'erreur :
    #
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    # Pas de includeSubDomains ni de preload tant que les autres sous-domaines
    # d'immotopia.cloud ne sont pas tous servis en HTTPS. Les autres en-tetes
    # (CSP en Report-Only, Permissions-Policy, X-Frame-Options...) viennent du
    # nginx embarque (infra/nginx/spa.conf) et traversent ce proxy : ne pas les
    # dupliquer ici. Puis : sudo nginx -t && sudo systemctl reload nginx.

    # La pile applicative ecoute uniquement en loopback : rien n'est expose
    # directement sur l'exterieur.
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Pas de keep-alive parasite vers l'amont.
        proxy_set_header Connection "";

        # Les exports Excel et la generation de documents peuvent etre longs.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        # Televersements : ne pas tamponner l'integralite du corps sur disque.
        proxy_request_buffering off;
    }
}
