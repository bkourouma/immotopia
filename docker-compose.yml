# Local development stack: Postgres + API.
# Replaces the Windows-only .bat launchers for anyone who wants a reproducible
# database. The frontend still runs with `npm run dev:web`.
#
#   docker compose up -d db      # database only (most common)
#   docker compose up -d         # database + API
services:
  db:
    image: postgres:16-alpine
    container_name: immotopia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-immotopia}
      # Obligatoire, sans valeur par defaut : exporter POSTGRES_PASSWORD (ou le poser
      # dans un fichier .env a la racine, ignore par git) avant `docker compose up`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD (openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-immotopia}
    ports:
      # Boucle locale uniquement : la base ne doit pas etre joignable depuis le reseau.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-immotopia} -d ${POSTGRES_DB:-immotopia}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      # Root context: the monorepo has a single lockfile at the root.
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: immotopia-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-immotopia}:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-immotopia}?schema=public
      # Required: the API refuses to start without a strong secret.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - generate with: openssl rand -base64 48}"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8001}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "8001"
    ports:
      # Boucle locale uniquement : hors production, le simulateur de paiement
      # (validation d'un paiement sans argent) est servi par l'API ; il ne doit
      # pas etre joignable depuis le reseau local.
      - "127.0.0.1:8001:8001"
    volumes:
      - api-uploads:/data/uploads

volumes:
  db-data:
  api-uploads:
